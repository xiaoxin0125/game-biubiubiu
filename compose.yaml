name: games-online

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/xiaoxin0125/game-biubiubiu:latest}
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_CONFIG_FILE: ${APP_CONFIG_FILE:-/app/config/.env}
      DATABASE_URL: mysql://${MYSQL_USER:-games}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in config/.env}@mysql:3306/${MYSQL_DATABASE:-games_online}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in config/.env}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CSRF_ALLOWED_ORIGINS: ${CSRF_ALLOWED_ORIGINS:?Set CSRF_ALLOWED_ORIGINS in config/.env}
      CSRF_REQUIRE_ORIGIN: ${CSRF_REQUIRE_ORIGIN:-1}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      MAX_STATE_BYTES: ${MAX_STATE_BYTES:-8388608}
      USER_UPLOAD_QUOTA_BYTES: ${USER_UPLOAD_QUOTA_BYTES:-2147483648}
      MAX_SAVE_SLOT: ${MAX_SAVE_SLOT:-9}
      VITE_WEBRTC_STUN_URLS: ${VITE_WEBRTC_STUN_URLS:-stun:${TURN_PUBLIC_HOST:?Set TURN_PUBLIC_HOST in config/.env}:${TURN_PORT:-45123}}
      VITE_WEBRTC_TURN_URLS: ${VITE_WEBRTC_TURN_URLS:-turn:${TURN_PUBLIC_HOST:?Set TURN_PUBLIC_HOST in config/.env}:${TURN_PORT:-45123}?transport=udp,turn:${TURN_PUBLIC_HOST:?Set TURN_PUBLIC_HOST in config/.env}:${TURN_PORT:-45123}?transport=tcp}
      VITE_WEBRTC_TURN_USERNAME: ${VITE_WEBRTC_TURN_USERNAME:-${TURN_USERNAME:?Set TURN_USERNAME in config/.env}}
      VITE_WEBRTC_TURN_CREDENTIAL: ${VITE_WEBRTC_TURN_CREDENTIAL:-${TURN_PASSWORD:?Set TURN_PASSWORD in config/.env}}
      VITE_WEBRTC_FORCE_RELAY: ${VITE_WEBRTC_FORCE_RELAY:-0}
      VITE_WEBRTC_ICE_SERVERS: ${VITE_WEBRTC_ICE_SERVERS:-}
      UPLOADS_DIR: /app/data/uploads
      BIOS_DIR: /app/data/bios
      SAVES_DIR: /app/data/saves
      CORES_DIR: /app/data/cores
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-32741}:3000"
    volumes:
      - /www/wwwroot/game-biu/data:/app/data
      - /www/wwwroot/game-biu/config:/app/config:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-games_online}
      MYSQL_USER: ${MYSQL_USER:-games}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in config/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in config/.env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - /www/wwwroot/game-biu/mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  coturn:
    image: coturn/coturn:alpine
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=${TURN_PORT:-45123}
      - --listening-ip=${TURN_LISTENING_IP:?Set TURN_LISTENING_IP in config/.env}
      - --relay-ip=${TURN_RELAY_IP:?Set TURN_RELAY_IP in config/.env}
      - --min-port=${TURN_MIN_PORT:-45124}
      - --max-port=${TURN_MAX_PORT:-45129}
      - --external-ip=${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP in config/.env}/${TURN_RELAY_IP:?Set TURN_RELAY_IP in config/.env}
      - --realm=${TURN_REALM:-games-online}
      - --server-name=${TURN_REALM:-games-online}
      - --user=${TURN_USERNAME:?Set TURN_USERNAME in config/.env}:${TURN_PASSWORD:?Set TURN_PASSWORD in config/.env}
      - --fingerprint
      - --lt-cred-mech
      - --no-multicast-peers
      - --stale-nonce=600
      - --no-tls
      - --no-dtls
      - --log-file=stdout
    volumes:
      - /www/wwwroot/game-biu/coturn:/var/lib/coturn
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge