# 基础编排：应用 + MySQL。只启动这两个容器不需要任何 TURN 配置。
#
#   docker compose --env-file /www/wwwroot/game-biu/config/.env up -d --no-build
#
# 跨网络联机需要自建中继时，再叠加 compose.turn.yaml（见该文件头部说明）：
#
#   docker compose --env-file /www/wwwroot/game-biu/config/.env \
#     -f compose.yaml -f compose.turn.yaml up -d --no-build
name: games-online

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/xiaoxin0125/game-biubiubiu:latest}
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # 留空时应用自动检测配置文件（挂载目录里的 config/.env、config/app.env、config/app.json）
      APP_CONFIG_FILE: ${APP_CONFIG_FILE:-}
      DATABASE_URL: mysql://${MYSQL_USER:-games}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in config/.env}@mysql:3306/${MYSQL_DATABASE:-games_online}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in config/.env}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CSRF_ALLOWED_ORIGINS: ${CSRF_ALLOWED_ORIGINS:?Set CSRF_ALLOWED_ORIGINS in config/.env}
      CSRF_REQUIRE_ORIGIN: ${CSRF_REQUIRE_ORIGIN:-1}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      MAX_STATE_BYTES: ${MAX_STATE_BYTES:-8388608}
      USER_UPLOAD_QUOTA_BYTES: ${USER_UPLOAD_QUOTA_BYTES:-2147483648}
      MAX_SAVE_SLOT: ${MAX_SAVE_SLOT:-9}
      # WebRTC 全部可选：STUN 建议在后台「站点设置」里填，这里留空即可；
      # TURN 由 compose.turn.yaml 叠加写入，单独用本文件启动时不会配置中继。
      VITE_WEBRTC_STUN_URLS: ${VITE_WEBRTC_STUN_URLS:-}
      VITE_WEBRTC_TURN_URLS: ${VITE_WEBRTC_TURN_URLS:-}
      VITE_WEBRTC_TURN_USERNAME: ${VITE_WEBRTC_TURN_USERNAME:-}
      VITE_WEBRTC_TURN_CREDENTIAL: ${VITE_WEBRTC_TURN_CREDENTIAL:-}
      VITE_WEBRTC_FORCE_RELAY: ${VITE_WEBRTC_FORCE_RELAY:-0}
      VITE_WEBRTC_ICE_SERVERS: ${VITE_WEBRTC_ICE_SERVERS:-}
      UPLOADS_DIR: /app/data/uploads
      BIOS_DIR: /app/data/bios
      SAVES_DIR: /app/data/saves
      CORES_DIR: /app/data/cores
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-32741}:3000"
    volumes:
      - ${GAME_DATA_DIR:-/www/wwwroot/game-biu/data}:/app/data
      - ${GAME_CONFIG_DIR:-/www/wwwroot/game-biu/config}:/app/config:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-games_online}
      MYSQL_USER: ${MYSQL_USER:-games}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in config/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in config/.env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - ${GAME_MYSQL_DIR:-/www/wwwroot/game-biu/mysql}:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    driver: bridge
