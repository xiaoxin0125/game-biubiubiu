# 远端资源服务器：核心文件（libretro js / wasm）的静态站点
#
# 安装位置建议：宝塔站点配置的 include 目录，例如
#   /www/server/panel/vhost/nginx/extension/cores.ppxin.com/cores.conf
# 站点根目录指向 /www/wwwroot/cores，映射关系：
#   deploy/sync-cores.sh 上传到  /www/wwwroot/cores/releases/<release>/
#   浏览器取                 https://<域名>/releases/<release>/fbneo.wasm
#   后台「核心资源」填        https://<域名>/releases
#
# 注意：
#   - 必须 HTTPS。主站是 https + HSTS，浏览器会拦掉跨域的 http 资源。
#   - CORS 用 * 即可：核心文件是公开静态资源，请求不带 cookie。
#   - 只发布 releases 目录，不要把项目、配置或数据目录放到站点根目录下。
#   - gzip_static 依赖同名的 .gz 文件（deploy/build-cores.mjs 已经生成）。
#   - 远端只需要 releases 目录：主站自己保存 current.json 指针，远端不用同步它。

server {
    listen 443 ssl http2;
    server_name cores.example.com;

    # 由宝塔申请的证书地址替换
    ssl_certificate     /www/server/panel/vhost/cert/cores.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cores.example.com/privkey.pem;

    root /www/wwwroot/cores;
    index index.html;

    # 版本号由内容决定：同一个地址下的字节永远不变，可以放心长缓存。
    location ^~ /releases/ {
        # 只允许只读方法：静态资源站不需要任何写入口
        limit_except GET HEAD { deny all; }

        gzip_static on;                 # 命中 <文件>.gz，不再现场压缩 34 MB
        gzip on;
        gzip_types application/wasm application/javascript;

        types {
            application/wasm wasm;
            application/javascript js;
            application/json json;
        }
        default_type application/octet-stream;

        # 错误响应也要带 CORS：这样前端能读到 404/403 并触发回退，而不是一个
        # 看不出原因的网络错误。
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Vary "Accept-Encoding" always;
        # 这一行故意不加 always：只有成功响应才带一年缓存，缺文件的 404 不缓存，
        # 否则一次上传未完成就会被浏览器记成"永久 404"。
        add_header Cache-Control "public, max-age=31536000, immutable";

        try_files $uri =404;
    }

    location = /health {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "cores ok\n";
    }

    location / { return 404; }
}
