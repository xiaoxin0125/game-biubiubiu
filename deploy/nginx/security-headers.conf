# 静态文档与静态资源的安全响应头。
#
# 为什么放在 nginx：前端产物 frontend/dist 由 nginx 直接提供，不经过 Node ——
# 后端 middleware/security.js 生成的那套头只对 /api/ 生效（经反向代理透传）。
#
# 为什么每个 location 都要 include 一遍：nginx 的 add_header **不继承** —— 只在
# server 块里写、而子 location 里另有 add_header 时，server 那份会被整块丢掉
# （首页原来就是这样连 HSTS 一起丢掉的，见 2026-10-16 重审 N-1）。
#
# 不要 include 到 `location ^~ /api/`：后端自己已经发了这些头，两边都发会出现
# 重复的响应头。
#
# connect-src 里的 https://cores.ppxin.com 不能省：远端核心（js/wasm）与远端 ROM
# 都由浏览器 fetch 加载，远端 ROM 还会经 302 跟随过去，少了这个源会被 CSP 拦死。
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' blob: 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: blob: https://cores.ppxin.com; worker-src 'self' blob:; media-src 'self' blob:" always;
