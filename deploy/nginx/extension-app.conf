# 站点反向代理与单页应用回退。
# 安装位置：/www/server/panel/vhost/nginx/extension/xbw.ppxin.com/app.conf
# 该目录已被宝塔生成的站点配置 include，因此不需要修改面板管理的站点文件。
#
# 前端构建产物 frontend/dist 是站点根目录，由 Nginx 直接提供；
# 只有 /api/（含联机 WebSocket /api/rooms/:code/ws）转发给本机后端。
#
# 安全响应头放在 includes/ 子目录里的两个片段（仓库同名的 security-headers*.conf）：
#   includes/security-headers.conf            frame-ancestors 'none'  / XFO DENY
#   includes/security-headers-self-frame.conf frame-ancestors 'self'  / XFO SAMEORIGIN
# 子目录不会被上面那条 `*.conf` glob 匹配到，所以它们只会被本文件按需 include；
# 每个 location 都要引一遍，因为 nginx 的 add_header 不继承（见 2026-10-16 重审 N-1）。
# 唯一不引的是 location ^~ /api/ —— 后端自己已经发了同一套头，两边都发会出重复响应头。

client_max_body_size 110m;

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 核心文件（/api/cores/...）刻意继续交给 Node：
#   - Node 读 data/cores-dist/<release>/，并按发布清单校验体积；没有构建发布目录
#     时退回 data/cores 的同名文件，所以本机不需要再存一份 98 MB。
#   - 压缩交给全局 gzip（见 /www/server/nginx/conf/nginx.conf 的 gzip_types，
#     需要包含 application/wasm），或者交给远端资源服务器上的 gzip_static。
# 不要在这里加 location ^~ /api/cores/ 的静态直出：那会绕过版本校验，
# 也容易出现".gz 与 .wasm 不是同一批"的陈旧缓存问题。

# 开发期文件不上线。`public/` 里的文件会被 vite 原样复制进 `dist` 当成静态资源
# 对外提供，历史上就发生过 /j2me/apply-site-patches.mjs 与 /j2me/INTEGRATION.md
# 被访客直接下载（2026-10 安全审计 H-3）。构建脚本
# （frontend/scripts/prune-dist-devfiles.js）现在已经把它们清掉了，这里再加一层，
# 防止以后有人把同类文件放回 public/。
# 正则 location 的优先级低于 `^~ /api/`，但高于下面的普通前缀 location（包括
# /j2me/），所以这条判断始终有效。
location ~* \.(?:mjs|md|markdown|map|ts|tsx|scss)$ {
    return 404;
}

# 例外：上游 J2meJS 的许可证与出处说明（GPL-2.0 分发要求）必须保持可访问。
# 站点主配置里宝塔的敏感文件规则连裸名 LICENSE / *.md 一起拦掉了，所以这里用
# 精确匹配（`=` 的优先级高于正则 location）把它们放出来 —— 它们本来就是公开资料，
# 详见 frontend/scripts/j2me-integration.md。
location = /j2me/LICENSE {
    include /www/server/panel/vhost/nginx/extension/xbw.ppxin.com/includes/security-headers.conf;
    try_files $uri =404;
}

location = /j2me/LICENSE-README.md {
    include /www/server/panel/vhost/nginx/extension/xbw.ppxin.com/includes/security-headers.conf;
    try_files $uri =404;
}

# J2ME 运行时页面会被播放页嵌进同源 iframe，所以这一个前缀下的文档用
# frame-ancestors 'self' / XFO SAMEORIGIN，其余路径保持一律拒绝（避免点击劫持）。
# 开发期文件的拦截由上面的正则 location 负责，它的优先级更高。
location /j2me/ {
    include /www/server/panel/vhost/nginx/extension/xbw.ppxin.com/includes/security-headers-self-frame.conf;
    try_files $uri $uri/ @spa;
}

# 运行时下的脚本、样式与图片：站点主配置里那两条正则（`.js|.css` 12h、图片 30d）
# 的优先级高于普通前缀 location，会绕开安全头。本文件在站点配置里先被 include，
# 正则 location 按出现顺序匹配，所以这里按同一前缀补一条就能抢在它们前面。
# 缓存策略与主配置保持一致，只多补上安全头。
location ~* ^/j2me/.*\.(?:gif|jpg|jpeg|png|bmp|swf)$ {
    include /www/server/panel/vhost/nginx/extension/xbw.ppxin.com/includes/security-headers-self-frame.conf;
    expires 30d;
    access_log off;
}

location ~* ^/j2me/.*\.(?:js|css)$ {
    include /www/server/panel/vhost/nginx/extension/xbw.ppxin.com/includes/security-headers-self-frame.conf;
    expires 12h;
    access_log off;
}

location = /api {
    return 404;
}

# 带内容哈希的构建产物可以放心长缓存：文件名一变就是新 URL（2026-10 审计 L-9）。
# 安全头与 HSTS 都来自 include 的片段 —— add_header 不继承也不叠加，这里不能
# 再手写 HSTS，否则会发两个 Strict-Transport-Security。
# 不用 `expires` 指令：它会额外再发一个 Cache-Control，和下面这条重复。
location ^~ /assets/ {
    include /www/server/panel/vhost/nginx/extension/xbw.ppxin.com/includes/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Expires "Thu, 31 Dec 2037 23:55:55 GMT" always;
    access_log off;
}

# 首页不缓存，保证发布新版本后浏览器能拿到新的资源清单。
location = /index.html {
    include /www/server/panel/vhost/nginx/extension/xbw.ppxin.com/includes/security-headers.conf;
    add_header Cache-Control "no-cache";
}

# 前端使用 history 路由，未知路径交回 index.html。
# 例外：带扩展名的路径一定是静态文件（漏了 /j2me/xxx.js 这类），返回真 404
# 而不是回 index.html —— 否则浏览器会把 HTML 当 JS/CSS 解析，报一堆看不懂的错。
location / {
    include /www/server/panel/vhost/nginx/extension/xbw.ppxin.com/includes/security-headers.conf;
    try_files $uri $uri/ @spa;
}

# @spa 直接返回文件（不再走 location = /index.html），所以安全头也要引一遍。
location @spa {
    include /www/server/panel/vhost/nginx/extension/xbw.ppxin.com/includes/security-headers.conf;
    if ($uri ~ "\.") { return 404; }
    try_files /index.html =500;
}
