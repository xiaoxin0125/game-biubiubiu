# 布局 2 的完整站点配置：这一台机器上跑 **PHP 版** rom-upload，
# nginx 自己既当 rom-upload（PHP），又顺带提供核心静态文件。
#
# 适用场景：NAT 机只有一个映射端口（现在是 14272），CDN（腾讯 EO）的回源端口已经指向它。
# 这样只需要一个端口：PHP 处理 /health /upload /files /signed，nginx 处理 /releases 静态文件。
#
# 放置位置：宝塔「网站 → 设置 → 配置文件」，整段替换即可（保留 CERT-APPLY-CHECK 与
# SSL-START/END 标记，宝塔申请证书时会用到）。
#
# 上线前必须做的事：
#   1) 站点根目录指向 /www/wwwroot/rom-upload-php，且该目录里的 index.php 必须是
#      **带 /signed/:id 的版本**（没有的话先打补丁：node deploy/patch-remote-signed.mjs index.php）。
#   2) 停掉原来的 Node 版 rom-upload（否则它同样占着 14272，nginx 起不来）：
#      systemctl disable --now rom-upload
#   3) 把数据搬过去（两版目录结构相同，ROM 不用重传）：
#      cp -a /www/wwwroot/rom-upload/data /www/wwwroot/rom-upload-php/
#      chown -R www:www /www/wwwroot/rom-upload-php/data
#      并把 config.json 的 dataDir 指到 /www/wwwroot/rom-upload-php/data，token 沿用原来的值
#      （这样主站后台的「远端服务地址 + 密钥」一个字都不用改）。
#   4) config.json 要 chmod 600 且属主 www（下面的敏感文件规则会再挡一层）。
#
# 后台「站点设置」对应填：
#   远端存储 → 远端服务地址   http://43.248.3.138:14272   （服务器间调用，直连，不走 CDN）
#   远端存储 → 下载地址       https://cores.ppxin.com     （没有 /rom 前缀：/signed 就在根路径）
#   远端存储 → 下载签名密钥   和 config.json 的 downloadSecret 一致
#   核心资源 → 远端核心地址   https://cores.ppxin.com/releases
#
# EO 侧：回源协议改成 **HTTP**（现在是跟随后，https 回源打到没有 443 的源站 → 521），
#        回源端口保持 14272，回源 Host 用加速域名（默认就是）。

server
{
    listen 14272;
    # 加 cores.ppxin.com：CDN 回源默认带加速域名的 Host，匹配不上会落到默认站点。
    # 保留 IP 是为了直连（主站上传、健康检查都用它）。
    server_name 43.248.3.138 cores.ppxin.com;

    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/rom-upload-php;

    # 大 ROM 上传：宝塔默认 50m 会把请求挡在 PHP 之前
    client_max_body_size 200m;
    fastcgi_read_timeout 600s;
    fastcgi_send_timeout 600s;
    # 数据目录禁止外部访问
    location ^~ /data/ { deny all; }
    # 配置文件里有 token 与 downloadSecret，精确匹配优先级最高，先挡掉
    location = /config.json { return 404; }

    # ── 核心静态文件（版本号由内容决定，同一地址下的字节永远不变）─────────────
    location ^~ /releases/ {
        root /www/wwwroot/cores;

        limit_except GET HEAD { deny all; }

        gzip_static on;                 # 命中 <文件>.gz，不再现场压缩 34 MB
        gzip on;
        gzip_types application/wasm application/javascript;

        types {
            application/wasm wasm;
            application/javascript js;
            application/json json;
        }
        default_type application/octet-stream;

        # 主站页面是另一个源，跨域读取必须带 CORS；CDN 会把这两个头一起缓存。
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Vary "Accept-Encoding" always;
        # 故意不加 always：缺文件的 404 不能被缓存成"永久 404"。
        add_header Cache-Control "public, max-age=31536000, immutable";

        try_files $uri =404;
    }

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/43.248.3.138.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/43.248.3.138/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-82.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    #  伪静态里要有：location / { try_files $uri $uri/ /index.php?$query_string; }
    #  PHP 版靠它把 /health /upload /files /signed 都交给 index.php。
    #  注意：这里已经有 location / 了，不要再自己写一个，否则报 duplicate location "/"。
    include /www/server/panel/vhost/rewrite/43.248.3.138.conf;
    #REWRITE-END

    # 禁止访问的敏感文件（比宝塔默认多了 config\.json 与 config\.example\.json）
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|config\.json|config\.example\.json|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/43.248.3.138.log;
    error_log  /www/wwwlogs/43.248.3.138.error.log;
}
