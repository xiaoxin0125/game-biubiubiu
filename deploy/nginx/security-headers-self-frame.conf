# 与 security-headers.conf 完全相同，只有「谁能嵌我」这两行放宽：
# J2ME 运行时页面（/j2me/main.html 等）要被同源的播放页放进 iframe，所以这里用
# SAMEORIGIN + frame-ancestors 'self'，其余路径一律 DENY / 'none'。
#
# 改这里的 CSP 时记得同步 security-headers.conf（两份只差 frame-ancestors 一行）。
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' blob: 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: blob: https://cores.ppxin.com; worker-src 'self' blob:; media-src 'self' blob:" always;
