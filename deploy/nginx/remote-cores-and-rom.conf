# 源站片段：核心静态文件 + ROM 下载（放进**已有站点**的 server { } 里）
#
# ⚠️ 这是 server{} 内部的片段，不是完整的 server 块：
#    - 粘贴时不要把本文件的注释头尾一起复制，也不要多写一个右括号 }；
#      多一个 } 会把 server 提前闭合，后面宝塔自带的 location 就跑到 server 外面，
#      nginx 报错：`"location" directive is not allowed here`。
#    - 如果站点「伪静态」里已经有 location /（宝塔默认那段 try_files），
#      这里就**不要再写** location /，否则报 `duplicate location "/"`。
#
# 用途：NAT 机只有一个映射端口，CDN 回源也只能填一个「主机:端口」，
#       所以核心与 ROM 必须挂在同一个端口、用路径区分。
#
#   加速域名              https://cores.ppxin.com    （回源协议 HTTP，回源端口 = 本站点 listen 的端口）
#   /releases/<版本>/<文件>   → /www/wwwroot/cores/releases/...      静态，gzip_static 直出
#   /rom/signed/<id>?exp=&sig= → http://127.0.0.1:<rom-upload 端口>/signed/<id>?...
#
# 后台「站点设置」对应填：
#   核心资源 → 远端核心地址           https://cores.ppxin.com/releases
#   远端存储 → 下载地址（开直连时才用） https://cores.ppxin.com/rom
#   远端存储 → 远端服务地址            http://<公网IP>:<rom-upload 端口>（直连源站，不走 CDN）
#
# 另外三件必须确认的事：
#   1) 本站点 listen 的端口**不能**与下面的 proxy_pass 端口相同，否则 nginx 代理到自己。
#   2) server_name 要包含 cores.ppxin.com：CDN 回源默认带加速域名的 Host，
#      匹配不上会落到默认站点，表现为 404 或串站。
#   3) 站点根目录若指向 rom-upload 项目目录，务必在「禁止访问的敏感文件」正则里
#      加上 config\.json：那里面有 token 和 downloadSecret。

    # 版本号由内容决定，同一地址下的字节永远不变，可以放心长缓存。
    location ^~ /releases/ {
        root /www/wwwroot/cores;

        limit_except GET HEAD { deny all; }

        gzip_static on;                 # 命中 <文件>.gz，不再现场压缩 34 MB
        gzip on;
        gzip_types application/wasm application/javascript;

        types {
            application/wasm wasm;
            application/javascript js;
            application/json json;
        }
        default_type application/octet-stream;

        # 主站页面是另一个源，跨域读取必须带 CORS；CDN 会把这两个头一起缓存。
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Vary "Accept-Encoding" always;
        # 故意不加 always：缺文件的 404 不能被缓存成"永久 404"。
        add_header Cache-Control "public, max-age=31536000, immutable";

        try_files $uri =404;
    }

    # ROM 浏览器直连：去掉 /rom 前缀转给 rom-upload，它的 /signed/:id 自带
    # CORS、Range 与 no-store（所以 CDN 不会缓存它，这是有意的）。
    location ^~ /rom/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8790/;   # ← 改成这台机器上 rom-upload 的真实端口
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;                 # 大文件边收边发，不落磁盘
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "origin ok\n";
    }
